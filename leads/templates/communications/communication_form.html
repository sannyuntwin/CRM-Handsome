{% extends 'leads/base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - {{ lead.first_name }} {{ lead.last_name }} - CRM System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3>{{ title }} - {{ lead.first_name }} {{ lead.last_name }}</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Communication</button>
                        <a href="{% url 'lead_detail' lead.pk %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
